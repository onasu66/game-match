compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[d1_databases]]
binding = "DB"
database_name = "game-match-db"
database_id = "1dcafdc4-076c-48d6-af29-ddd70c955639"

